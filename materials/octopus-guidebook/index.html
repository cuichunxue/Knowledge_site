<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>再現ガイドブック | 分解できる3Dロボットを作る</title>
<meta name="description" content="参考画像1枚から分解できる3Dロボットを作るまで（STEP 1〜4）の再現ガイドブック。">
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#17201b;--muted:#5d6b63;--line:#dde4de;--brand:#14744a;--brand-l:#e3f5ec;--code:#16201b;--code-ink:#d7f5e5;--inline:#eef3f0;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#17201b;--ink:#eef5f0;--muted:#9fb1a7;--line:#2c3a33;--brand:#4fd197;--brand-l:#1d3329;--code:#0b100d;--inline:#22302a;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.85;font-size:16px}
.hero{background:linear-gradient(135deg,#0d3a27,#14744a 60%,#1f9d63);color:#fff;padding:40px max(16px,env(safe-area-inset-left)) 32px}
.hero .in{max-width:1180px;margin:0 auto}
.hero .tag{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 12px;font-size:12px;font-weight:700;letter-spacing:.06em}
.hero h1{margin:10px 0 6px;font-size:clamp(22px,4.4vw,34px);line-height:1.35}
.hero p{margin:0;opacity:.9;max-width:720px}
.hero .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hero a{color:#0d3a27;background:#fff;text-decoration:none;font-weight:800;font-size:13px;border-radius:999px;padding:7px 14px}
.hero a.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}
.wrap{max-width:1180px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left)) 80px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
nav.toc{position:sticky;top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;max-height:calc(100vh - 32px);overflow:auto;font-size:13px}
nav.toc b{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;margin:0 6px 6px}
nav.toc a{display:block;color:var(--ink);text-decoration:none;padding:5px 8px;border-radius:8px;line-height:1.45}
nav.toc a:hover{background:var(--brand-l)}
nav.toc a.on{background:var(--brand-l);color:var(--brand);font-weight:800}
article{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px clamp(16px,4vw,40px);min-width:0}
article h1{display:none}
article h2{font-size:22px;margin:40px 0 12px;padding-top:12px;border-top:1px solid var(--line);line-height:1.45}
article h2:first-of-type{border-top:0;margin-top:8px}
article h3{font-size:17px;margin:26px 0 8px;color:var(--brand)}
article p,article li{max-width:76ch}
article a{color:var(--brand)}
article hr{border:0;border-top:1px dashed var(--line);margin:28px 0}
article blockquote{margin:16px 0;padding:10px 16px;background:var(--brand-l);border-left:4px solid var(--brand);border-radius:8px}
article code{background:var(--inline);padding:1px 6px;border-radius:5px;font-size:.88em;word-break:break-word}
article pre{background:var(--code);color:var(--code-ink);padding:14px 16px;border-radius:12px;overflow-x:auto;font-size:13px;line-height:1.6;position:relative}
article pre code{background:none;padding:0;color:inherit;word-break:normal}
.copy{position:absolute;top:8px;right:8px;border:0;background:#2c3a33;color:#fff;border-radius:6px;font-size:11px;padding:3px 9px;cursor:pointer}
.tbl{overflow-x:auto;margin:14px 0;-webkit-overflow-scrolling:touch}
article table{border-collapse:collapse;font-size:14px;min-width:100%}
article th,article td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
article th{background:var(--brand-l);white-space:nowrap}
article input[type=checkbox]{margin-right:6px;transform:scale(1.15)}
article ul.contains-task-list,article li.task-list-item{list-style:none}
#err{color:#c0392b;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 40px}
@media (max-width:860px){.wrap{grid-template-columns:1fr}nav.toc{position:static;max-height:none}}
@media print{.hero .acts,nav.toc{display:none}.wrap{display:block}article{border:0}}
</style>
</head>
<body>
<header class="hero">
  <div class="in">
    <span class="tag">GUIDEBOOK · STEP 1〜4</span>
    <h1>再現ガイドブック：参考画像1枚から「分解できる3Dロボット」を作る</h1>
    <p>Glass-Dome Octopus の制作手順を、別の題材でも同じように再現できるようにまとめました。プロンプトの要点、コマンド、設計の型、つまずいた点と直し方を作業順に載せています。</p>
    <div class="acts">
      <a href="../glass-dome-octopus/index.html" target="_blank" rel="noopener">🐙 完成品の3Dを開く</a>
      <a class="ghost" href="../glass-dome-octopus/GUIDEBOOK.md" download>⬇ Markdown をダウンロード</a>
    </div>
  </div>
</header>
<div class="wrap">
  <nav class="toc" aria-label="目次"><b>目次</b><div id="toc"></div></nav>
  <article id="doc"><p>読み込み中…</p></article>
</div>
<footer>本文は <code>materials/glass-dome-octopus/GUIDEBOOK.md</code> を読み込んで表示しています。Markdown 変換：marked（MIT）</footer>
<script src="vendor/marked.min.js"></script>
<script>
(async () => {
  const doc = document.getElementById('doc');
  const toc = document.getElementById('toc');
  try {
    const res = await fetch('../glass-dome-octopus/GUIDEBOOK.md', {cache: 'no-cache'});
    if (!res.ok) throw new Error(res.status);
    const md = await res.text();
    doc.innerHTML = marked.parse(md, {gfm: true});
  } catch (e) {
    doc.innerHTML = '<p id="err">ガイドブックを読み込めませんでした。ローカルでは <code>python3 -m http.server</code> で開いてください。</p>';
    return;
  }
  // wide tables scroll sideways on phones
  doc.querySelectorAll('table').forEach((t) => {
    const w = document.createElement('div');
    w.className = 'tbl';
    t.replaceWith(w);
    w.append(t);
  });
  // links out of the page open in a new tab
  doc.querySelectorAll('a[href^="http"]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; });
  // copy buttons on code blocks
  doc.querySelectorAll('pre').forEach((pre) => {
    const b = document.createElement('button');
    b.className = 'copy';
    b.textContent = 'コピー';
    b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(pre.querySelector('code').innerText); b.textContent = 'コピーしました'; } catch { b.textContent = 'コピーできません'; }
      setTimeout(() => (b.textContent = 'コピー'), 1500);
    });
    pre.append(b);
  });
  // table of contents from the h2 headings, with the current section highlighted
  const heads = [...doc.querySelectorAll('h2')];
  heads.forEach((h, i) => {
    h.id = 'sec-' + i;
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    toc.append(a);
  });
  const links = [...toc.querySelectorAll('a')];
  const io = new IntersectionObserver((es) => {
    es.forEach((e) => {
      if (!e.isIntersecting) return;
      links.forEach((l) => l.classList.toggle('on', l.getAttribute('href') === '#' + e.target.id));
    });
  }, {rootMargin: '0px 0px -70% 0px'});
  heads.forEach((h) => io.observe(h));
})();
</script>
</body>
</html>
